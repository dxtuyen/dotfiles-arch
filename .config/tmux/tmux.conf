
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi







set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       10
set  -g history-limit     10000

# Foot advertises RGB outside tmux; applications use tmux-256color inside.
set -as terminal-features ',foot*:RGB'
set -g renumber-windows on

# New shells follow the pane's working directory (also used by Bash's nt).
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Prefix-based navigation leaves LazyVim's Ctrl+h/j/k/l available.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-style 'bg=#32302f,fg=#d4be98'
set -g status-left '#[fg=#a9b665,bold] #S #[default]'
set -g status-right '#[fg=#928374] %H:%M '
setw -g window-status-current-style 'bg=#45403d,fg=#d8a657,bold'
set -g pane-border-style 'fg=#45403d'
set -g pane-active-border-style 'fg=#7daea3'
set -g message-style 'bg=#3c3836,fg=#ddc7a1'
